apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authcore
  namespace: argocd
  labels:
    app: authcore
    environment: production
spec:
  project: authcore
  source:
    repoURL: https://github.com/your-org/authcore.git
    targetRevision: main
    path: deploy/k8s
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authcore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
