services:
  - type: web
    name: authcore-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: authcore-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: authcore-redis
          property: connectionString
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OAUTH_ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true

  - type: redis
    name: authcore-redis
    ipAllowList: []
    plan: starter

databases:
  - name: authcore-postgres
    databaseName: authcore
    user: authcore
    plan: starter
